<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日历 · Just be present.</title>
<style>
  :root{
    --bg:#f2f2f4; --panel:#fbfbfc; --card:#fbfbfc; --line:#a6abd0;
    --ink:#3a3f52; --muted:#9aa0b4; --faint:#b9bdcf;
    --accent:#7c84b8; --accent-soft:#e9ebf4; --surface-dim:#f5f5f7; --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}

  .app{display:flex;min-height:100vh}

  /* ---------- 左侧边栏 ---------- */
  .sidebar{
    width:280px; flex-shrink:0; padding:28px 22px;
    background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:26px;
    position:sticky; top:0; height:100vh;
  }
  .brand h1{font-size:26px; font-weight:600; letter-spacing:2px}
  .brand p{font-size:12px; color:var(--muted); margin-top:4px; letter-spacing:.5px}

  .clock-wrap{text-align:center; padding:6px 0 2px}
  .clock-wrap svg{width:120px; height:120px}
  .clock-time{margin-top:10px; font-size:13px; color:var(--muted); letter-spacing:2px}

  .view-switch{display:flex; flex-direction:column; background:#e9ebf4; border-radius:16px; padding:4px; gap:4px}
  .view-switch button{
    padding:9px 14px; border-radius:12px; font-size:14px; color:var(--muted); text-align:left;
  }
  .view-switch button.active{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px}
  .backup-row{display:flex; gap:8px}
  .backup-row button{
    flex:1; font-size:12px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:6px 0;
    background:var(--card);
  }
  .backup-row button:hover{color:var(--ink); border-color:var(--accent)}
  .privacy{font-size:11px; line-height:1.6; color:var(--faint)}

  /* ---------- 主区域 ---------- */
  .main{flex:1; padding:28px 30px 40px; min-width:0}
  .month-bar{display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap}
  .month-subtitle{font-size:12px; color:var(--muted); line-height:1.6}
  .month-subtitle div:first-child{color:var(--ink)}
  .month-bar h1{
    font-family:Georgia,"Songti SC","SimSun",serif;
    font-size:30px; font-weight:600; letter-spacing:1px;
  }
  .month-bar .nav-btn{
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line); background:var(--card);
    font-size:20px; line-height:1; color:var(--muted);
  }
  .month-bar .nav-btn:hover{color:var(--ink); border-color:var(--accent)}
  .month-bar .today-btn{
    margin-left:auto; font-size:13px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:7px 16px; background:var(--card);
  }
  .month-bar .today-btn:hover{color:var(--ink); border-color:var(--accent)}
  .month-bar.todo-mode .nav-btn, .month-bar.todo-mode .today-btn{display:none}

  /* 月历网格 */
  .cal-head,.cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
  }
  .cal-head{margin-bottom:2px}
  .cal-head div{
    text-align:center; font-size:12px; color:#9aa0b4; font-weight:500; padding:8px 0;
  }
  .cal-grid{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; box-shadow:0 1px 6px rgba(58,63,82,.05);
  }
  .cal-cell{
    min-height:0; padding:8px 9px; cursor:pointer; position:relative;
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    background:var(--card); text-align:left; width:100%;
  }
  .cal-cell:nth-child(7n){border-right:none}
  .cal-cell:nth-last-child(-n+7){border-bottom:none}
  .cal-cell:hover{background:#f5f5f7}
  .cal-cell.other-month{opacity:.38}
  .cal-cell.selected{background:var(--accent-soft)}
  .cal-cell .solar{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; font-size:15px;
  }
  .cal-cell.today .solar{background:var(--accent); color:#fff}
  .cal-cell .lunar{font-size:11px; color:var(--muted); margin-top:3px}
  .cal-cell .lunar.festival{color:#b06a6a}
  .cal-cell .dots{margin-top:6px; display:flex; gap:4px; flex-wrap:wrap}
  .cal-cell .dot{width:6px; height:6px; border-radius:50%; background:var(--accent)}
  .cal-cell .ev-mini{
    font-size:11px; color:var(--ink); background:var(--accent-soft);
    border-radius:6px; padding:2px 6px; margin-top:5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 日程视图：24 小时时间轴 */
  .agenda-list{display:flex; flex-direction:column; min-height:0}
  .tl-allday{display:flex; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px; margin-bottom:14px}
  .tl-allday-label{width:52px; flex-shrink:0; font-size:12px; color:var(--muted); padding-top:4px}
  .tl-allday-items{flex:1; display:flex; flex-direction:column; gap:8px; min-width:0}
  .tl-empty{font-size:13px; color:var(--faint); padding:2px 0}
  .tl-hours{display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .tl-hour{display:flex; min-height:52px; border-bottom:1px solid var(--line); cursor:pointer}
  .tl-hour:last-child{border-bottom:none}
  .tl-hour:hover{background:#f5f5f7}
  .tl-hour-label{width:64px; flex-shrink:0; font-size:12px; color:var(--muted); padding:10px 0 0 16px}
  .tl-hour-body{flex:1; position:relative; padding:8px 12px 8px 0; display:flex; flex-direction:column; gap:6px; min-width:0}
  .tl-ev{background:var(--accent-soft); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
  .tl-ev:hover{background:#dfe2f0}
  .tl-ev-time{font-size:12px; color:var(--accent); font-weight:600; flex-shrink:0}
  .tl-ev-note{font-size:12px; color:var(--muted)}
  .tl-ev.tl-todo{border:1px dashed var(--accent); background:var(--card)}
  .tl-todo-tag{font-size:11px; color:var(--muted)}
  .tl-now{position:absolute; left:0; right:0; height:2px; background:#b06a6a; z-index:1; pointer-events:none}
  .tl-now::before{content:''; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:#b06a6a}

  /* 待办视图 */
  .todo-add{display:flex; gap:10px; max-width:760px; margin-bottom:20px}
  .todo-add input[type=text]{flex:1; border:1px solid var(--line); border-radius:12px; padding:11px 14px; background:var(--card); outline:none; font-size:14px; min-width:0}
  .todo-add input[type=text]:focus{border-color:var(--accent)}
  .todo-add input[type=date]{border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--card); outline:none; font-size:13px; color:var(--muted)}
  .todo-add select{border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--card); outline:none; font-size:13px; color:var(--muted)}
  .todo-add button[type=submit]{background:var(--accent); color:#fff; border-radius:12px; padding:11px 20px; font-size:14px; flex-shrink:0}
  .todo-filter{display:flex; align-items:center; gap:8px; max-width:760px; margin-bottom:16px; font-size:13px; color:var(--muted)}
  .todo-filter button{border:1px solid var(--line); border-radius:999px; padding:5px 14px; font-size:13px; color:var(--muted); background:var(--card)}
  .todo-filter button:hover{border-color:var(--accent); color:var(--ink)}
  .todo-filter button.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .todo-list{max-width:760px; display:flex; flex-direction:column; gap:22px}
  .todo-section h3{font-size:13px; color:var(--muted); font-weight:600; margin-bottom:10px; display:flex; align-items:baseline; gap:8px}
  .todo-section h3 span{font-weight:400; font-size:12px; color:var(--faint)}
  .todo-item{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:8px}
  .todo-item:last-child{margin-bottom:0}
  .todo-check{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0; position:relative; background:transparent}
  .todo-check:hover{border-color:var(--accent)}
  .todo-item.done .todo-check{background:var(--accent); border-color:var(--accent)}
  .todo-item.done .todo-check::after{content:'✓'; position:absolute; inset:0; color:#fff; font-size:12px; line-height:19px; text-align:center}
  .todo-title{flex:1; font-size:14px; min-width:0; cursor:pointer}
  .todo-item.done .todo-title{text-decoration:line-through; color:var(--muted)}
  .todo-urg{width:12px; height:12px; border-radius:50%; flex-shrink:0; padding:0}
  .todo-urg.urgent{background:#b06a6a}
  .todo-urg.normal{background:#7c84b8}
  .todo-urg.low{background:#c4c7d6}
  .todo-date{font-size:12px; color:var(--muted); background:var(--accent-soft); border-radius:999px; padding:4px 10px; flex-shrink:0}
  .todo-date:hover{color:var(--ink)}
  .todo-date.today{color:var(--accent); font-weight:600}
  .todo-date.overdue{color:#b06a6a; background:#f6e8e8; font-weight:600}
  .todo-del{font-size:18px; color:var(--faint); line-height:1; padding:2px 4px; flex-shrink:0}
  .todo-del:hover{color:#b06a6a}
  .todo-edit{font-size:16px; color:var(--faint); line-height:1; padding:2px 4px; flex-shrink:0}
  .todo-edit:hover{color:var(--accent)}
  .todo-item.editing{flex-wrap:wrap}
  .todo-item.editing input[type=text]{flex:1; min-width:140px; border:1px solid var(--line); border-radius:10px; padding:8px 11px; background:#fff; outline:none; font-size:14px}
  .todo-item.editing input[type=text]:focus{border-color:var(--accent)}
  .todo-item.editing input[type=date]{border:1px solid var(--line); border-radius:10px; padding:7px 10px; background:#fff; outline:none; font-size:13px; color:var(--muted)}
  .todo-item.editing select{border:1px solid var(--line); border-radius:10px; padding:7px 10px; background:#fff; outline:none; font-size:13px; color:var(--muted)}
  .todo-edit-save{background:var(--accent); color:#fff; border-radius:10px; padding:8px 14px; font-size:13px}
  .todo-edit-cancel{color:var(--muted); font-size:13px; padding:8px 6px}
  .todo-clear{margin-left:auto; font-size:12px; color:var(--muted); font-weight:400}
  .todo-clear:hover{color:#b06a6a}
  .todo-empty{color:var(--faint); font-size:14px; padding:30px 0}
  .todo-folder{margin-bottom:4px}
  .todo-folder-head{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:10px; padding:2px 0}
  .todo-folder-arrow{font-size:11px; color:var(--faint); transition:transform .15s}
  .todo-folder.collapsed .todo-folder-arrow{transform:rotate(-90deg)}
  .todo-folder.collapsed .todo-folder-body{display:none}
  .todo-folder-dot{width:10px; height:10px; border-radius:50%}
  .todo-folder-dot.urgent{background:#b06a6a}
  .todo-folder-dot.normal{background:#7c84b8}
  .todo-folder-dot.low{background:#c4c7d6}
  .todo-folder-count{font-weight:400; font-size:12px; color:var(--faint)}
  body.no-day-panel .day-panel{display:none}

  /* 年历视图（全年打卡） */
  .habit-filter{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px}
  .habit-filter button{display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--muted); background:var(--card)}
  .habit-filter button:hover{border-color:var(--accent); color:var(--ink)}
  .habit-filter button.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .habit-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0}
  .habit-dot.water{background:#8fb3d9}
  .habit-dot.sleep{background:#b3a6d6}
  .habit-dot.save{background:#93bfa0}
  .habit-dot.poop{background:#d3ac7e}
  .day-editor{display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:16px}
  .day-editor[hidden]{display:none}
  .day-editor-date{font-size:14px; font-weight:600; margin-right:4px}
  .day-editor-chip{border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--muted); background:#fff}
  .day-editor-chip.on{color:#fff; border-color:transparent}
  .day-editor-chip.on[data-habit=water]{background:#8fb3d9}
  .day-editor-chip.on[data-habit=sleep]{background:#b3a6d6}
  .day-editor-chip.on[data-habit=save]{background:#93bfa0}
  .day-editor-chip.on[data-habit=poop]{background:#d3ac7e}
  .day-editor-close{margin-left:auto; font-size:18px; color:var(--faint); line-height:1; padding:2px 6px}
  .year-grid{display:flex; flex-direction:column; gap:12px; padding-bottom:20px}
  .yr-row{display:flex; align-items:center; gap:12px}
  .yr-month{width:36px; flex-shrink:0; font-size:13px; color:var(--muted); text-align:right}
  .yr-pill{flex:1; display:flex; gap:2px; border:1px solid var(--line); border-radius:999px; padding:5px 8px; background:var(--card); min-width:0}
  .yr-row:nth-child(even) .yr-pill{margin-left:56px; margin-right:56px}
  .yr-day{flex:1; min-width:0; height:26px; font-size:11px; color:var(--muted); display:flex; align-items:center; justify-content:center; padding:0}
  .yr-day span{display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; flex-shrink:0}
  .yr-day:hover span{background:var(--accent-soft)}
  .yr-day.today span{box-shadow:0 0 0 1.5px var(--accent)}
  .yr-day.selected span{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .yr-day.today.selected span{box-shadow:0 0 0 1.5px var(--accent), inset 0 0 0 1.5px var(--accent)}
  .yr-day.h-water span{background:#8fb3d9; color:#2f3a4a}
  .yr-day.h-sleep span{background:#b3a6d6; color:#2f3a4a}
  .yr-day.h-save span{background:#93bfa0; color:#2f3a4a}
  .yr-day.h-poop span{background:#d3ac7e; color:#2f3a4a}
  .yr-day.h-multi span{background:#5d6280; color:#fff}

  /* ---------- 日期详情面板 ---------- */
  .day-panel{
    width:340px; flex-shrink:0;
    background:var(--panel); border-left:1px solid var(--line);
    padding:26px 24px; overflow-y:auto;
    position:sticky; top:0; height:100vh;
  }
  .day-panel .dp-head{display:flex; align-items:flex-start; justify-content:space-between}
  .day-panel h2{font-size:22px}
  .day-panel .dp-lunar{font-size:12px; color:var(--muted); margin-top:4px}
  .dp-close{font-size:22px; color:var(--muted); line-height:1; padding:2px 6px}
  .dp-close:hover{color:var(--ink)}
  .dp-events{margin-top:20px}
  .dp-timeline{position:relative; padding-left:22px}
  .dp-timeline::before{content:''; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:var(--line); border-radius:2px}
  .dp-tl-item{position:relative; margin-bottom:14px; cursor:pointer}
  .dp-tl-item:last-child{margin-bottom:0}
  .dp-tl-item::before{content:''; position:absolute; left:-20px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--panel)}
  .dp-tl-time{font-size:12px; color:var(--muted)}
  .dp-tl-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin-top:3px}
  .dp-tl-card:hover{border-color:var(--accent)}
  .dp-tl-title{font-size:14px}
  .dp-tl-note{font-size:12px; color:var(--muted); margin-top:3px; white-space:pre-wrap}
  .dp-tl-todo .dp-tl-card{border-style:dashed}
  .dp-todo-tag{font-size:11px; color:var(--muted); margin-right:6px}
  .dp-empty{color:var(--faint); font-size:13px; margin-top:20px}
  .dp-add{
    margin-top:18px; width:100%; padding:11px; border-radius:12px;
    border:1px dashed var(--line); color:var(--muted); font-size:14px; background:var(--card);
  }
  .dp-add:hover{color:var(--ink); border-color:var(--accent)}

  /* 今日总结栏 */
  .dp-summary{margin-top:20px; padding-top:16px; border-top:1px solid var(--line)}
  .dp-sum-head{display:flex; align-items:baseline; justify-content:space-between}
  .dp-sum-head h3{font-size:14px; font-weight:600}
  .dp-sum-head span{font-size:11px; color:var(--faint)}
  .mood-row{display:flex; gap:6px; margin:12px 0}
  .mood-btn{font-size:22px; line-height:1; padding:6px; border-radius:12px; border:1px solid transparent}
  .mood-btn:hover{background:var(--accent-soft)}
  .mood-btn.selected{background:var(--accent-soft); border-color:var(--accent)}
  .dp-summary textarea{width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px; background:#fff; outline:none; font-size:13px; resize:vertical; min-height:56px}
  .dp-summary textarea:focus{border-color:var(--accent)}

  /* 事项表单 */
  .ev-form{margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px}
  .ev-form label{display:block; font-size:12px; color:var(--muted); margin:12px 0 5px}
  .ev-form label:first-child{margin-top:0}
  .ev-form input[type=text], .ev-form input[type=date], .ev-form input[type=time], .ev-form textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px;
    background:#fff; outline:none; font-size:14px;
  }
  .ev-form input:focus, .ev-form textarea:focus{border-color:var(--accent)}
  .ev-form textarea{resize:vertical; min-height:64px}
  .ev-form .row{display:flex; gap:10px; align-items:center}
  .ev-form .row > div{flex:1}
  .ev-form .check-row{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--muted)}
  .ev-form .btn-row{display:flex; gap:8px; margin-top:16px}
  .ev-form .btn-save{
    flex:1; background:var(--accent); color:#fff; border-radius:10px; padding:10px; font-size:14px;
  }
  .ev-form .btn-del{color:#b06a6a; border:1px solid #e3c8c8; border-radius:10px; padding:10px 14px; font-size:14px}
  .ev-form .btn-cancel{color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:14px}

  .overlay{
    position:fixed; inset:0; background:rgba(58,63,82,.25); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .overlay.show{opacity:1; pointer-events:auto}

  /* 桌面端：详情栏常驻右侧，不需要关闭按钮和遮罩；整月刚好占满一屏，不出滚动条 */
  @media (min-width:861px){
    .dp-close{display:none}
    .overlay{display:none}
    .app{height:100vh; overflow:hidden}
    .day-panel{display:flex; flex-direction:column; overflow:hidden}
    .dp-scroll{flex:1; overflow-y:auto; min-height:0}
    .dp-summary{flex-shrink:0}
    .main{display:flex; flex-direction:column; min-height:0}
    .month-bar{flex-shrink:0}
    #monthView:not([hidden]){flex:1; min-height:0; display:flex; flex-direction:column}
    .cal-head{flex-shrink:0}
    .cal-grid{flex:1; min-height:0; grid-template-rows:repeat(6,minmax(0,1fr))}
    #agendaView:not([hidden]), #todoView:not([hidden]), #yearView:not([hidden]){flex:1; min-height:0; overflow-y:auto}
    #yearView:not([hidden]){display:flex; flex-direction:column; overflow:hidden}
    #yearView .year-grid{flex:1; min-height:0; padding-bottom:0}
    #yearView .yr-row{flex:1; min-height:0; align-items:stretch}
    #yearView .yr-month{align-self:center}
    #yearView .yr-day{height:auto; font-size:13px}
    #yearView .yr-day span{width:34px; height:34px}
  }

  /* 移动端底部导航 */
  .mobile-nav{display:none}

  @media (max-width: 860px){
    .sidebar{display:none}
    .main{padding:20px 14px 90px}
    .month-bar h1{font-size:24px}
    .cal-cell{min-height:64px; padding:6px 5px}
    .cal-cell .solar{width:24px; height:24px; font-size:14px}
    .cal-cell .lunar{font-size:10px}
    .cal-cell .ev-mini{display:none}
    .tl-hour-label{width:52px; padding-left:10px}
    .tl-allday-label{width:44px}
    .todo-add{flex-wrap:wrap}
    .todo-add input[type=text]{flex-basis:100%}
    .yr-day span{display:none}
    .yr-month{width:30px; font-size:12px}
    .yr-pill{padding:4px 6px; gap:1px}
    .yr-day{height:20px; border-radius:5px}
    .yr-day.h-water{background:#8fb3d9}
    .yr-day.h-sleep{background:#b3a6d6}
    .yr-day.h-save{background:#93bfa0}
    .yr-day.h-poop{background:#d3ac7e}
    .yr-day.h-multi{background:#5d6280}
    .yr-day.today{outline:1.5px solid var(--accent); outline-offset:-1.5px}
    .yr-day.selected{box-shadow:inset 0 0 0 1.5px var(--accent)}
    .yr-row{gap:8px}
    .yr-row:nth-child(even) .yr-pill{margin-left:24px; margin-right:24px}
    .day-panel{
      top:auto; bottom:0; left:0; right:0; width:100%; max-width:none;
      height:auto; max-height:78vh; border-left:none; border-top:1px solid var(--line);
      border-radius:20px 20px 0 0; transform:translateY(105%);
      padding:20px 18px 28px;
    }
    .day-panel.open{transform:translateY(0)}
    .mobile-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0; z-index:30;
      background:var(--panel); border-top:1px solid var(--line);
      padding:8px 16px calc(8px + env(safe-area-inset-bottom));
    }
    .mobile-nav button{
      flex:1; padding:9px 0; border-radius:999px; font-size:14px; color:var(--muted);
    }
    .mobile-nav button.active{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08)}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>日历</h1>
      <p>Just be present.</p>
    </div>

    <div class="clock-wrap">
      <svg id="clock" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="56" fill="#fbfbfc" stroke="#a6abd0" stroke-width="1.5"/>
        <g id="ticks"></g>
        <line id="hourHand" x1="60" y1="60" x2="60" y2="32" stroke="#3a3f52" stroke-width="3" stroke-linecap="round"/>
        <line id="minHand" x1="60" y1="60" x2="60" y2="22" stroke="#3a3f52" stroke-width="2" stroke-linecap="round"/>
        <line id="secHand" x1="60" y1="60" x2="60" y2="18" stroke="#7c84b8" stroke-width="1" stroke-linecap="round"/>
        <circle cx="60" cy="60" r="3" fill="#3a3f52"/>
      </svg>
      <div class="clock-time" id="clockTime"></div>
    </div>

    <nav class="view-switch" aria-label="视图切换">
      <button data-view="month" class="active">月历</button>
      <button data-view="agenda">日程</button>
      <button data-view="todo">待办</button>
      <button data-view="year">年历</button>
    </nav>

    <div class="sidebar-foot">
      <div class="backup-row">
        <button id="exportBtn" type="button">导出备份</button>
        <button id="importBtn" type="button">导入备份</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <p class="privacy">事项只保存在你自己的浏览器里，不会上传到任何服务器，别人看不到你的日历。</p>
    </div>
  </aside>

  <main class="main">
    <header class="month-bar" id="monthBar">
      <button class="nav-btn" id="prevMonth" type="button" aria-label="上个月">‹</button>
      <h1 id="monthTitle"></h1>
      <div class="month-subtitle">
        <div id="todaySolar"></div>
        <div id="todayLunar"></div>
      </div>
      <button class="nav-btn" id="nextMonth" type="button" aria-label="下个月">›</button>
      <button class="today-btn" id="todayBtn" type="button">今天</button>
    </header>

    <section id="monthView" aria-label="月历">
      <div class="cal-head">
        <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <section id="agendaView" aria-label="日程" hidden>
      <div class="agenda-list" id="agendaList"></div>
    </section>

    <section id="todoView" aria-label="待办" hidden>
      <form class="todo-add" id="todoAddForm">
        <input type="text" id="todoTitle" maxlength="80" placeholder="添加待办事项…" required>
        <input type="date" id="todoDate">
        <select id="todoUrgency" aria-label="紧急程度">
          <option value="normal" selected>一般</option>
          <option value="urgent">紧急</option>
          <option value="low">不急</option>
        </select>
        <button type="submit">添加</button>
      </form>
      <div class="todo-filter" id="todoFilter">
        <span>筛选：</span>
        <button type="button" data-filter="all" class="active">全部</button>
        <button type="button" data-filter="urgent">紧急</button>
        <button type="button" data-filter="normal">一般</button>
        <button type="button" data-filter="low">不急</button>
      </div>
      <div class="todo-list" id="todoList"></div>
    </section>

    <section id="yearView" aria-label="年历" hidden>
      <div class="habit-filter" id="habitFilter">
        <button type="button" data-habit="all" class="active">全部</button>
        <button type="button" data-habit="water"><span class="habit-dot water"></span>多喝水</button>
        <button type="button" data-habit="sleep"><span class="habit-dot sleep"></span>早睡</button>
        <button type="button" data-habit="save"><span class="habit-dot save"></span>攒钱</button>
        <button type="button" data-habit="poop"><span class="habit-dot poop"></span>噗噗</button>
      </div>
      <div class="day-editor" id="dayEditor" hidden>
        <span class="day-editor-date" id="dayEditorDate"></span>
        <button type="button" class="day-editor-chip" data-habit="water">多喝水</button>
        <button type="button" class="day-editor-chip" data-habit="sleep">早睡</button>
        <button type="button" class="day-editor-chip" data-habit="save">攒钱</button>
        <button type="button" class="day-editor-chip" data-habit="poop">噗噗</button>
        <button type="button" class="day-editor-close" id="dayEditorClose" aria-label="关闭">×</button>
      </div>
      <div class="year-grid" id="yearGrid"></div>
    </section>
  </main>

<section class="day-panel" id="dayPanel" aria-label="当日详情">
  <div class="dp-head">
    <div>
      <h2 id="dpTitle"></h2>
      <div class="dp-lunar" id="dpLunar"></div>
    </div>
    <button class="dp-close" id="dpClose" type="button" aria-label="关闭">×</button>
  </div>
  <div class="dp-scroll">
  <div class="dp-events" id="dpEvents"></div>
  <button class="dp-add" id="dpAdd" type="button">＋ 添加事项</button>
  <form class="ev-form" id="evForm" hidden>
    <label for="fTitle">事项</label>
    <input type="text" id="fTitle" maxlength="60" placeholder="写点什么…" required>
    <div class="row">
      <div>
        <label for="fDate">日期</label>
        <input type="date" id="fDate" required>
      </div>
      <div id="timeWrap">
        <label for="fTime">时间</label>
        <input type="time" id="fTime">
      </div>
    </div>
    <div class="check-row">
      <input type="checkbox" id="fAllDay" checked>
      <label for="fAllDay" style="margin:0">全天</label>
    </div>
    <label for="fNote">备注</label>
    <textarea id="fNote" maxlength="500" placeholder="可选"></textarea>
    <div class="btn-row">
      <button class="btn-save" type="submit">保存</button>
      <button class="btn-del" id="fDelete" type="button" hidden>删除</button>
      <button class="btn-cancel" id="fCancel" type="button">取消</button>
    </div>
  </form>
  </div>
  <div class="dp-summary">
    <div class="dp-sum-head"><h3>今日总结</h3><span>自动保存</span></div>
    <div class="mood-row" id="moodRow">
      <button type="button" class="mood-btn" data-mood="😄" aria-label="开心">😄</button>
      <button type="button" class="mood-btn" data-mood="🙂" aria-label="不错">🙂</button>
      <button type="button" class="mood-btn" data-mood="😐" aria-label="一般">😐</button>
      <button type="button" class="mood-btn" data-mood="😔" aria-label="低落">😔</button>
      <button type="button" class="mood-btn" data-mood="😢" aria-label="难过">😢</button>
      <button type="button" class="mood-btn" data-mood="😴" aria-label="疲惫">😴</button>
    </div>
    <textarea id="sumText" maxlength="140" rows="2" placeholder="一句话总结今天…"></textarea>
  </div>
</section>
</div>

<div class="overlay" id="overlay"></div>


<nav class="mobile-nav" aria-label="视图切换">
  <button data-view="month" class="active" type="button">月历</button>
  <button data-view="agenda" type="button">日程</button>
  <button data-view="todo" type="button">待办</button>
  <button data-view="year" type="button">年历</button>
</nav>

<script src="lunar.js"></script>
<script src="app.js?v=11"></script>
</body>
</html>
